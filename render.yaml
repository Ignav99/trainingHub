# Render Blueprint - TrainingHub Pro
# https://render.com/docs/blueprint-spec
# Production runs in FRANKFURT (co-located with Supabase EU) on Starter plan.
# Deploys are triggered by CI (deploy hooks) — autoDeploy stays off.

services:
  # Frontend Next.js
  - type: web
    name: traininghub-frontend-eu
    runtime: node
    region: frankfurt
    plan: starter
    autoDeploy: false  # Deploys are controlled by CI/CD via deploy hooks
    buildCommand: cd frontend && npm ci --include=dev && NODE_OPTIONS="--max-old-space-size=512" npm run build && cp -r .next/static .next/standalone/.next/static && if [ -d public ]; then cp -r public .next/standalone/public; fi
    startCommand: cd frontend && node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  # Backend API
  - type: web
    name: traininghub-api-eu
    runtime: python
    region: frankfurt
    plan: starter
    autoDeploy: false  # Deploys are controlled by CI/CD via deploy hooks
    buildCommand: cd backend && pip install -r requirements.txt
    # gunicorn = supervisor: reinicia el worker si se cae o si el event loop se
    # bloquea > --timeout. WEB_CONCURRENCY: 1 en Starter (512 MB; cada worker
    # ocupa ~250 MB + picos de WeasyPrint). Con plan Standard (2 GB) subir a 3.
    # Solo un worker ejecuta el scheduler RFAF (lock de fichero en app/main.py).
    startCommand: cd backend && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --timeout 120 --graceful-timeout 30 --keep-alive 75 --forwarded-allow-ips "*"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: WEB_CONCURRENCY
        value: "1"  # Starter 512 MB. Standard 2 GB -> "3"
      - key: THREADPOOL_SIZE
        value: "60"  # hilos para rutas `def` (Supabase síncrono)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false  # NEVER regenerate: medical-records encryption derives from it
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPERADMIN_EMAILS
        sync: false
      - key: SCRAPERAPI_KEY
        sync: false
      - key: RFAF_HTTPS_PROXY
        sync: false
    # Liveness only — never point this at /ready (DB checks can timeout and kill the service)
    healthCheckPath: /health
